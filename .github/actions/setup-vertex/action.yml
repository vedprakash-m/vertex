name: Set up Vertex
description: Install the locked public Vertex environment on Linux or Windows.
inputs:
  python-version:
    description: Python version used by the job
    required: false
    default: "3.11"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ inputs.python-version }}
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/vertex-uv-cache
        key: vertex-uv-${{ runner.os }}-${{ runner.arch }}-${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}
    - name: Install the pinned resolver
      shell: bash
      env:
        UV_CACHE_DIR: ${{ runner.temp }}/vertex-uv-cache
      run: python -m pip install --disable-pip-version-check "uv==0.13.7"
    - name: Install the frozen dependency graph
      shell: bash
      env:
        UV_DEFAULT_INDEX: https://pypi.org/simple
        UV_CACHE_DIR: ${{ runner.temp }}/vertex-uv-cache
      run: uv sync --frozen --all-extras
    - name: Expose the locked environment
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
        else
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        fi
