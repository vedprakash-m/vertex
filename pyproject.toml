[build-system]
# setuptools>=83.0.0: PYSEC-2026-3447 (WS-7 pip-audit --strict gate failed
# on 2026-07-27's first real CI run with 79.0.1 installed).
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex"
version = "0.1.0"
description = "Governed TPM intelligence platform for evidence, decisions, and operational program reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.17.1",
  "cryptography>=43.0.0",
  "Jinja2>=3.1.4",
  "jsonschema>=4.23.0",
  "keyring>=25.3.0",
  "beautifulsoup4>=4.12",
  "icalendar>=5.0",
  "portalocker>=3.1.1",
  "pypdf>=5.7.0",
  "python-docx>=1.1",
  "PyYAML>=6.0.2",
  "requests>=2.32.3",
  "rich>=13.7.1",
  "python-dotenv>=1.0.0",
  # Upper bounds: typer 0.26.x / click 8.4.x changed CLI group introspection and
  # broke scripts/generate_intent_routes._click_root() ("Vertex CLI root is not
  # a Click group") plus root NL routing / typer.Exit handling. Cap below the
  # breaking releases until the introspection is made forward-compatible.
  "typer>=0.12.3,<0.26",
  "click>=8.1.7,<8.4",
]

[project.scripts]
vx = "cli:app"
vertex = "cli:app"

[project.optional-dependencies]
# Dev/CI tooling (WS-7 pip-audit + the test/lint stack). BL-C5: these five
# used to live only in the now-removed requirements.txt, meaning `pip
# install -e ".[dev]"` could not by itself set up a working dev environment.
# `pip install -e ".[dev]"` to enable.
dev = [
  "pip-audit>=2.7.0",
  "pytest>=8.3.0",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.6.0",
  "pytest-mock>=3.14.0",
  "mypy>=1.10.0",
]
# WO-8 (specs/backlog.md BL-C5): named extras for optional integration
# surfaces, split out of the retired flat requirements.txt so a base install
# doesn't need to compile pydantic-core (an openai transitive dependency) or
# pull in integrations most deployments don't use. Every package here is
# already imported lazily/defensively at its call site (try/except ImportError
# with a graceful-degradation path or a domain QueryError) -- see
# src/adapters/microsoft/kusto_runtime.py's load_kusto_sdk_types() and
# src/core/entity_registry.py's rapidfuzz import for the existing pattern
# this extras split formalizes, not introduces.
ai = [
  # Frontier LLM provider access (src/ai/request_router.py dynamically
  # imports this) and its tokenizer (src/ai/context_tokenizers.py,
  # src/core/context_budget.py). Pulls in pydantic v2 transitively --
  # deliberately isolated here, not in base, since pydantic-core is a
  # compiled (Rust) wheel.
  "openai>=1.30.0",
  "tiktoken>=0.7.0",
]
ai-local = [
  # Tier-1 "local semantic" seam in src/ai/tiered_router.py (embeddings /
  # fuzzy match / keyword graph, near-zero OpEx) -- today this tier is
  # implemented entirely by rapidfuzz fuzzy matching (src/core/entity_registry.py);
  # no local-inference engine (e.g. an on-device LLM runtime) is wired up yet,
  # so this extra is intentionally small until one is.
  "rapidfuzz>=3.9,<4",
]
m365 = [
  # msgraph-sdk: NOT currently imported anywhere in src/ as of 2026-07-22 --
  # grepped before adding this. The delegated Graph API scopes this SDK would
  # serve are permanently blocked by MS IT (see governance/decisions and the
  # local .eml/.ics/Teams-JSON import pivot); kept declared here rather than
  # dropped outright since WO-8 is a packaging change, not a dependency-
  # removal decision -- removing it is a separate, smaller follow-up.
  "msgraph-sdk>=1.15.0",
]
kusto = [
  # src/adapters/microsoft/kusto_runtime.py's load_kusto_sdk_types()
  "azure-kusto-data>=4.3",
]
render = [
  # src/core/charts/declarative.py, src/core/charts/deployment_velocity.py,
  # src/core/kusto_rendering.py, src/core/theme_context.py
  "matplotlib>=3.8",
]

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
explicit_package_bases = true
warn_unused_configs = true

# EnumParserMixin relies on Enum metaclass iteration/default-member patterns that
# mypy currently mis-models here; we track these as ignore-with-rationale in H5.
[[tool.mypy.overrides]]
module = "src.core.models"
disable_error_code = ["attr-defined", "misc"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.core.config_loader", "src.commands.doctor"]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
addopts = "-n auto"
# Do not set basetemp here — pytest temp dirs belong in the system %TEMP%, not output/.
# If a basetemp override is needed (e.g. for CI artifact collection), use .pytest-tmp/
# (gitignored). Never point basetemp at output/ — that directory is for program artifacts.
tmp_path_retention_policy = "failed"
markers = [
    "slow: marks tests as slow (excluded from inner dev loop; run on CI or with -m slow)",
    "eval_ci: ADF-W0.15 CI regression evaluation lane (synthetic fixtures + Issue-079 regression corpus; deterministic, no LLM calls)",
]
