# Version selection is registered config, not convention: every prompt version
# selected by code must appear here, and every registered version must have a
# matching <version>.txt in this directory. Both directions are enforced by
# tests/contracts/test_prompt_registry.py. Adding a new prompt version is a
# one-line edit here plus the .txt file — no scattered constants to hunt down.
