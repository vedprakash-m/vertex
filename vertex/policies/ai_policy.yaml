policy_schema_version: "1"
ai_features:
  action_extractor:
    max_tokens: 500
    temperature: 0.0
    model_tier: standard
    frontier_eligible: true
  anticipation_engine:
    max_tokens: 220
    temperature: 0.2
    model_tier: standard
    frontier_eligible: true
  backfill_extractor:
    max_tokens: 1200
    temperature: 0.2
    model_tier: standard
    frontier_eligible: true
  blurb_generator:
    max_tokens: 160
    temperature: 0.4
    model_tier: standard
    frontier_eligible: true
  claim_extractor:
    max_tokens: 800
    temperature: 0.0
    model_tier: standard
    frontier_eligible: true
  context_synthesizer:
    # NCFL Phase 5 Zone B knowledge-doc synthesis (§24.6). Output is always a
    # proposal; never auto-applied. Bounded by accepted-proposal + narrative input.
    max_tokens: 800
    temperature: 0.1
    model_tier: standard
    frontier_eligible: true
  decision_brief_advisor:
    max_tokens: 450
    temperature: 0.1
    model_tier: standard
    frontier_eligible: true
  dependency_blast_radius_generator:
    # ADF-W4.5 remainder: Section 8.10.2 next-proving-event + blast-radius
    # narrative generation. QG-29-gated before any caller may apply it.
    max_tokens: 700
    temperature: 0.1
    model_tier: standard
    frontier_eligible: true
  exec_summary_drafter:
    max_tokens: 220
    temperature: 0.3
    model_tier: standard
    frontier_eligible: true
  governance_decision_brief_generator:
    # ADF-W4.7 remainder: Section 8.10.7 governance decision brief
    # generation. Distinct from decision_brief_advisor (editorial proposal
    # review). QG-29-gated before any caller may apply it.
    max_tokens: 1000
    temperature: 0.1
    model_tier: standard
    frontier_eligible: true
  intent_router:
    max_tokens: 500
    temperature: 0.1
    model_tier: standard
    frontier_eligible: true
  learning_distiller:
    max_tokens: 900
    temperature: 0.2
    model_tier: standard
    frontier_eligible: true
  m365_topic_router:
    max_tokens: 400
    temperature: 0.0
    model_tier: standard
    frontier_eligible: true
  meeting_action_extractor:
    # ADF-W3.3: Section 8.10.4 step 2 -- LLM extraction on residual
    # transcript content only (the deterministic marker tier runs
    # separately in src/core/meeting_action.py). Every output is
    # QG-29-gated (ai_release_audit) before any caller may consume it.
    max_tokens: 1200
    temperature: 0.1
    model_tier: standard
    frontier_eligible: true
  onboard_assistant:
    structure_max_tokens: 600
    style_max_tokens: 500
    temperature: 0.2
    model_tier: standard
    frontier_eligible: true
  summary_generator:
    max_tokens: 420
    temperature: 0.2
    model_tier: standard
    frontier_eligible: true
  synthesizer:
    max_tokens: 1000
    temperature: 0.2
    model_tier: standard
    frontier_eligible: true
  risk_proposal_generator:
    # ADF-W4.5: Section 8.10.1 risk proposal generation for CANDIDATE-kind
    # risks only. Every output is QG-29-gated before any caller may apply
    # it, and apply_risk_proposal only ever fires on human approval.
    max_tokens: 800
    temperature: 0.1
    model_tier: standard
    frontier_eligible: true
  top_three_candidate_generator:
    # ADF-W4.7: Section 8.10.6 top-three candidate selection + write-up,
    # reusing ADF-W2.9's assembled ProgramSynthesisRequest as the candidate
    # pool. QG-29-gated before any caller may consume the result.
    max_tokens: 900
    temperature: 0.1
    model_tier: standard
    frontier_eligible: true
  setup_assistant:
    max_tokens: 400
    temperature: 0.3
    model_tier: standard
    frontier_eligible: true
  program_synthesizer:
    # ADF-W2.9: shared program-synthesis contract (Section 8.10.5). Bounded by
    # assemble_program_synthesis_request's assembled input items; every output
    # is QG-29-gated before any consumer (cockpit today) may read it.
    max_tokens: 1200
    temperature: 0.1
    model_tier: standard
    frontier_eligible: true
  prose_event_extractor:
    max_tokens: 1500
    temperature: 0.0
    model_tier: standard
    frontier_eligible: true
    deterministic_first: true
    tier0_confidence_threshold: 0.9
  rev_extractor:
    max_tokens: 2048
    temperature: 0.0
    model_tier: standard
    frontier_eligible: true
    deterministic_first: false
  rev_judge:
    max_tokens: 2000
    temperature: 0.0
    model_tier: standard
    frontier_eligible: true
  activation_judge:
    max_tokens: 4096
    temperature: 0.0
    model_tier: standard
    frontier_eligible: true
  default:
    max_tokens: 500
    temperature: 0.2
    model_tier: standard
    frontier_eligible: true
