  - id: durability-profile
    area: "Reliability"
    description: >-
      SQLite/lease/outbox durability contracts: local WAL and network-path
      DELETE journal modes; synchronous=NORMAL locally and FULL for network
      paths or explicit durability="strict"; busy_timeout=5000ms with an
      8-attempt jittered exponential backoff for initial WAL-file contention.
      Workspace leases use wall-clock time without explicit clock-rollback
      handling; monotonically increasing DB-authoritative fencing tokens are
      checked on renew/release to prevent unfenced dual-writer access.
      Clock assumptions and deployment suitability require separate review.
      Outbox schema initialization is additive CREATE-TABLE-IF-NOT-EXISTS,
      without ALTER-based migration; outstanding intents must survive schema
      reestablishment. Revisit this contract if ALTER migrations are added.
      Storage-backend migration rebuilds from the authoritative file journal
      in an isolated directory, swaps via os.replace, and preserves the prior
      state as a backup; interruption before the final swap leaves the target
      untouched, and rerunning rebuilds rather than resumes partial state.
      Backup consistency requires an isolated backup/verify/restore drill;
      no actual drill result or deployment approval is asserted here.
    budget_class: fault-injection
    direction: qualitative
    unit: null
    value: null
    status: candidate
    ratified_at: null
    ratified_by: null
