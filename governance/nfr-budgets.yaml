# NFR / OpEx budget candidates (arch-fix.md Phase 0, §8 / §A.0).
#
# Every row starts life as `status: candidate` (a proposed contract, not yet
# enforced). Ratification (candidate -> ratified) is a human/PM decision —
# not something a coding pass can perform on its own — and is recorded here
# with `ratified_at` + `ratified_by` once it happens. The companion contract
# test (`tests/contracts/test_nfr_budget_freeze_contract.py`) enforces that a
# ratified budget's numeric value can never be loosened by a later edit
# ("no later phase may lower a budget to pass" — arch-fix.md §A.0).
#
# `direction` tells the freeze test which way is "tighter":
#   ceiling      - the value is a maximum; a ratified ceiling may only move down or stay.
#   floor        - the value is a minimum; a ratified floor may only move up or stay.
#   qualitative  - no single number to ratchet; the contract is a procedure/policy,
#                  evidenced by the stated budget_class (e.g. a restore drill).
schema_version: "1"

