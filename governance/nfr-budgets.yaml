# Public NFR / OpEx candidate template, not deployment authority or evidence.
#
# No operational measurements, selected deployment values, or actual
# ratifications belong here. Candidate values remain unset until an authorized
# owner measures and ratifies them in a separate private registry.
#
# The existing load_nfr_budgets(path) / ratified_budgets(path) APIs accept that
# explicit private registry path. Their default is this public template; it
# must not be used as evidence of deployment approval or qualification.
# Separating this template does not revoke any private ratification.
#
# Freeze each private ratified ceiling/floor against its approved baseline:
# ceilings may only decrease; floors may only increase. Qualitative rows
# describe a policy/procedure rather than a numeric ratchet. Public tests use
# deliberately synthetic registries to exercise this contract.
